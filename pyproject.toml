[project]
name = "zerolinks"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "minifzf>=0.1.4",
    "rich==13.7.0",
    "sqlalchemy>=2.0.43",
    "typer>=0.17.4",
]

[project.scripts]
zero = "zerolink.cli:app"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zerolink*"]
exclude = ["zerolink.pylint_custom*"] # Exclude local pylint plugins from distribution

[dependency-groups]
dev = [
    "pylint>=3.3.8",
    "pyinstaller>=6.15.0",
]

